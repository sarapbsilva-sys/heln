<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trilha de Conhecimento - HELN</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Biblioteca de ícones (FontAwesome para o ícone de cadeado e seta) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Conteúdo Central: Caixa de Login -->
    <main class="login-container">
        <div class="login-card">
            <!-- Ícone de Cadeado -->
            <div class="lock-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <!-- Títulos -->
            <h2>Chave da integração</h2>
            <p class="login-subtitle">Digite a chave entregue pelo Núcleo de Segurança do Paciente.</p>

            <!-- Formulário -->
            <form action="#" method="POST">
                <div class="input-group">
                    <input type="text" placeholder="C H A V E" required>
                </div>
                <button type="submit" class="btn-validar">Validar chave</button>
            </form>

            <!-- Link de Voltar -->
            <a href="index.html" class="btn-voltar">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="icon-voltar">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
    </svg>
    Voltar
</a>
        </div>
    </main>

    <!-- Rodapé -->
   <footer class="footer-bar">
    <div class="footer-content">
        <img src="../imgs/logos.png" alt="Logo" class="footer-logo">
        <p>Departamento de Qualidade e Segurança do Paciente | HELN</p>
    </div>
</footer>

</body>
</html>
